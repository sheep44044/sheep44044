<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sheep44044</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        .typing-container {
            height: 60px;
            margin: 30px 0;
        }
        .typing-text {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            white-space: nowrap;
            overflow: hidden;
            border-right: 2px solid #333;
            animation: typing 3.5s steps(30, end) infinite, blink 1s step-end infinite;
        }
        @keyframes typing {
            0% { width: 0 }
            50% { width: 100% }
            100% { width: 100% }
        }
        @keyframes blink {
            0%, 100% { border-color: transparent }
            50% { border-color: #333 }
        }
        .quote {
            font-style: italic;
            color: #666;
            margin-top: 30px;
            border-left: 3px solid #ddd;
            padding-left: 15px;
        }
    </style>
</head>
<body>
    <div align="left">
        <h1>sheep44044</h1>
        <p>📧 邮箱：3290120053@qq.com</p>
        <p>🌐 博客：sheep44044的小站</p>
        
        <div class="typing-container">
            <div class="typing-text" id="text1">Hello there! 👋</div>
            <div class="typing-text" id="text2" style="display: none;">Let's get better together</div>
        </div>
        
        <div class="quote">
            种一棵树最好的时间是十年前，其次是现在
        </div>
    </div>

    <script>
        let currentText = 1;
        setInterval(() => {
            const text1 = document.getElementById('text1');
            const text2 = document.getElementById('text2');
            
            if (currentText === 1) {
                text1.style.display = 'none';
                text2.style.display = 'block';
                currentText = 2;
            } else {
                text1.style.display = 'block';
                text2.style.display = 'none';
                currentText = 1;
            }
        }, 4000);
    </script>
</body>
</html>
